<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1f3a5f;--navy-2:#2c4f7c;--gold:#c9a24b;--bg:#f3f5f9;--card:#fff;--text:#1d2433;--muted:#5f6b7f;--line:#dde3ec;--err:#c0392b;--ok:#1e8e5a;--radius:14px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Noto Sans Thai',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  .hero{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;padding:32px 16px 70px}
  .hero-inner{max-width:820px;margin:0 auto}
  .badge{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:999px;font-size:13px}
  .hero h1{margin:12px 0 4px;font-size:clamp(24px,5vw,34px);line-height:1.3}
  .hero h1 small{display:block;font-size:15px;font-weight:500;opacity:.8;letter-spacing:1px}
  .hero p{margin:6px 0 0;opacity:.88;white-space:pre-line}
  .hero .bar{width:56px;height:4px;background:var(--gold);border-radius:4px;margin-top:14px}
  main{max-width:820px;margin:-46px auto 40px;padding:0 16px}
  .panel{background:var(--card);border-radius:var(--radius);box-shadow:0 2px 10px rgba(20,40,80,.07);padding:22px;margin-bottom:14px}
  .progress-wrap{position:sticky;top:0;z-index:5;padding:14px 18px}
  .progress-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:8px}
  .progress-top b{color:var(--navy)}
  .progress-top span{color:var(--muted);white-space:nowrap}
  .progress{height:8px;background:#e6ebf2;border-radius:99px;overflow:hidden}
  .progress div{height:100%;width:0;background:linear-gradient(90deg,var(--navy-2),var(--gold));transition:width .3s}
  .step-head{border-top:5px solid var(--gold)}
  .step-head h2{margin:0;color:var(--navy);font-size:21px}
  .step-head p{margin:4px 0 0;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px 16px}
  .f{grid-column:span 12;min-width:0}
  .w-half{grid-column:span 6}.w-third{grid-column:span 4}.w-quarter{grid-column:span 3}.w-twothird{grid-column:span 8}
  .sub{grid-column:span 12;margin:10px 0 -4px;font-weight:700;color:var(--navy);font-size:16px;display:flex;align-items:center;gap:8px}
  .sub:before{content:"";width:5px;height:18px;background:var(--gold);border-radius:3px}
  .sub.small{font-size:15px;margin-top:6px}
  details.grp{grid-column:span 12;border:1.5px dashed var(--line);border-radius:12px;padding:4px 14px}
  details.grp[open]{padding-bottom:14px}
  details.grp summary{cursor:pointer;font-weight:700;color:var(--navy);padding:8px 0}
  details.grp .grid{margin-top:6px}
  label.lb{display:block;font-weight:600;font-size:14.5px;margin-bottom:5px}
  .req{color:var(--err);margin-left:3px}
  .help{color:var(--muted);font-size:13.5px;margin:-2px 0 8px;white-space:pre-line}
  input[type=text],input[type=date],input[type=email],input[type=tel],textarea,select{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fbfcfe;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus,textarea:focus,select:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(44,79,124,.15);background:#fff}
  textarea{min-height:100px;resize:vertical}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opts.inline{flex-direction:row;flex-wrap:wrap}
  .opt{display:flex;align-items:flex-start;gap:9px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:#fff;transition:background .15s,border-color .15s}
  .opt:hover{background:#f6f8fc}
  .opt input{margin-top:5px;accent-color:var(--navy);width:17px;height:17px;flex:none}
  .opt.checked{border-color:var(--navy-2);background:#eef3fa}
  .pos-detail{margin-top:10px;padding:12px 14px;background:#f6f8fc;border-left:4px solid var(--gold);border-radius:8px;font-size:14.5px;white-space:pre-line;display:none}
  table.lang{width:100%;border-collapse:collapse;font-size:14px}
  table.lang th,table.lang td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
  table.lang td:first-child,table.lang th:first-child{text-align:left;font-weight:600}
  table.lang select{padding:7px 6px}
  .pers{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
  .file-drop{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);cursor:pointer}
  .file-drop:hover{border-color:var(--navy-2);background:#f6f8fc}
  .file-list div{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;background:#f3f6fb;border-radius:8px;margin-top:6px;font-size:14px}
  .file-list button{border:0;background:none;color:var(--err);cursor:pointer;font:inherit}
  .err-msg{color:var(--err);font-size:13.5px;margin-top:5px;display:none}
  .has-err .err-msg{display:block}
  .has-err input,.has-err select,.has-err textarea,.has-err .opt,.has-err .file-drop{border-color:var(--err)}
  .hidden{display:none !important}
  .actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px;flex-wrap:wrap}
  .actions .note{flex:1;text-align:center;color:var(--muted);font-size:14px}
  button.primary{font:inherit;font-weight:600;background:var(--navy);color:#fff;border:0;padding:12px 32px;border-radius:999px;cursor:pointer;box-shadow:0 4px 14px rgba(31,58,95,.3)}
  button.primary:hover{background:var(--navy-2)}
  button.primary:disabled{opacity:.6;cursor:wait}
  button.secondary{font:inherit;background:#fff;color:var(--navy);border:1.5px solid var(--line);padding:11px 24px;border-radius:999px;cursor:pointer}
  .draft{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:#fff8e6;border:1px solid #f0dca8;color:#7a5b12;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:14px}
  .draft button{font:inherit;border:0;background:none;color:var(--err);cursor:pointer;text-decoration:underline}
  .alert{background:#fdecea;color:var(--err);padding:12px 16px;border-radius:10px;margin-bottom:14px;display:none}
  .done{text-align:center;padding:46px 22px}
  .done .ic{width:72px;height:72px;border-radius:50%;background:#e5f5ec;color:var(--ok);display:grid;place-items:center;font-size:38px;margin:0 auto 14px}
  .done h2{margin:0 0 6px;color:var(--navy)}
  .appno{display:inline-block;margin-top:10px;padding:6px 16px;background:#eef3fa;border-radius:999px;font-weight:700;color:var(--navy)}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 30px}
  @media (max-width:640px){
    .w-half,.w-third,.w-quarter,.w-twothird{grid-column:span 12}
    .panel{padding:18px 16px}
    .actions{flex-direction:column-reverse;align-items:stretch}
    button.primary,button.secondary{width:100%}
  }
</style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <span class="badge" id="company"></span>
      <h1>ใบสมัครงาน<small>APPLICATION FORM</small></h1>
      <p id="intro"></p>
      <div class="bar"></div>
    </div>
  </header>
  <main>
    <div class="alert" id="alert"></div>
    <div class="draft hidden" id="draftNote">
      <span>กู้คืนข้อมูลที่คุณกรอกค้างไว้แล้ว (ไฟล์แนบต้องเลือกใหม่)</span>
      <button type="button" id="clearDraft">ล้างข้อมูลและเริ่มใหม่</button>
    </div>
    <div class="panel progress-wrap" id="progressWrap">
      <div class="progress-top"><b id="stepLabel"></b><span id="stepCount"></span></div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
    <form id="appForm" novalidate autocomplete="off">
      <div id="steps"></div>
      <div class="panel actions" id="actions">
        <button type="button" class="secondary" id="backBtn">‹ ย้อนกลับ</button>
        <span class="note"></span>
        <button type="button" class="primary" id="nextBtn">ถัดไป ›</button>
        <button type="submit" class="primary" id="submitBtn">ส่งใบสมัคร</button>
      </div>
    </form>
  </main>
  <footer id="footer"></footer>

<script>
const CONFIG = <?!= config ?>;
</script>
<script>
(function(){
  const C = CONFIG;
  const HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
  const DRAFT_KEY = 'rsc-job-app-draft-v2';
  const form = document.getElementById('appForm');
  const $ = id => document.getElementById(id);
  const fileStore = {};
  const FIELDS = [];
  let cur = 0;

  $('company').textContent = C.company;
  $('intro').textContent = C.intro || '';
  $('footer').textContent = '© ' + new Date().getFullYear() + ' ' + C.company;

  function el(tag, attrs, kids){
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs){
      const v = attrs[k];
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v; else e.setAttribute(k, v === true ? '' : v);
    }
    (kids || []).forEach(c => c && e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c));
    return e;
  }
  const listOf = f => f.opts || (C.lists && C.lists[f.list]) || [];

  /* ---------- render ---------- */
  function renderField(f){
    if (f.type === 'heading') return el('div', {class: 'sub' + (f.small ? ' small' : ''), text: f.label});
    FIELDS.push(f);
    const wrap = el('div', {class: 'f w-' + (f.w || 'full'), 'data-k': f.k});
    const lb = el('label', {class: 'lb', text: f.label});
    if (f.req) lb.appendChild(el('span', {class: 'req', text: '*'}));
    if (f.type !== 'check') wrap.appendChild(lb);
    if (f.help) wrap.appendChild(el('div', {class: 'help', text: f.help}));
    const k = f.k;
    switch (f.type){
      case 'text': case 'number': case 'tel': case 'email': case 'zip': case 'thaiid': {
        const attrs = {type: f.type === 'email' ? 'email' : f.type === 'tel' ? 'tel' : 'text', name: k, placeholder: f.ph};
        if (f.type === 'number' || f.type === 'zip' || f.type === 'thaiid') attrs.inputmode = f.type === 'number' ? 'decimal' : 'numeric';
        if (f.type === 'zip') attrs.maxlength = 5;
        if (f.type === 'thaiid'){ attrs.maxlength = 17; attrs.placeholder = 'เลข 13 หลัก'; }
        if (f.type === 'tel' && !f.ph) attrs.placeholder = 'เช่น 0812345678';
        if (f.list) attrs.list = 'dl_' + k;
        const inp = el('input', attrs);
        if (f.def) inp.value = f.def;
        wrap.appendChild(inp);
        if (f.list){ const dl = el('datalist', {id: 'dl_' + k}); listOf(f).forEach(o => dl.appendChild(el('option', {value: o}))); wrap.appendChild(dl); }
        break;
      }
      case 'date': wrap.appendChild(el('input', {type: 'date', name: k})); break;
      case 'textarea': wrap.appendChild(el('textarea', {name: k})); break;
      case 'select': {
        const s = el('select', {name: k}, [el('option', {value: '', text: '— เลือก —'})]);
        listOf(f).forEach(o => s.appendChild(el('option', {value: o, text: o})));
        wrap.appendChild(s); break;
      }
      case 'position': {
        const s = el('select', {name: k}, [el('option', {value: '', text: C.positions.length ? '— เลือกตำแหน่ง —' : 'ขณะนี้ยังไม่เปิดรับสมัคร'})]);
        C.positions.forEach(p => s.appendChild(el('option', {value: p.name, text: p.name})));
        const det = el('div', {class: 'pos-detail'});
        s.addEventListener('change', () => {
          const p = C.positions.find(x => x.name === s.value);
          det.textContent = p && p.detail ? p.detail : '';
          det.style.display = p && p.detail ? 'block' : 'none';
        });
        wrap.appendChild(s); wrap.appendChild(det); break;
      }
      case 'radio': case 'checks': {
        const box = el('div', {class: 'opts' + (f.inline ? ' inline' : '')});
        listOf(f).forEach(o => box.appendChild(el('label', {class: 'opt'}, [el('input', {type: f.type === 'radio' ? 'radio' : 'checkbox', name: k, value: o}), el('span', {text: o})])));
        wrap.appendChild(box); break;
      }
      case 'check': {
        const l = el('label', {class: 'opt'}, [el('input', {type: 'checkbox', name: k, value: 'ใช่'}), el('span', {text: f.label})]);
        if (f.req) l.lastChild.appendChild(el('span', {class: 'req', text: '*'}));
        wrap.appendChild(l); break;
      }
      case 'langtable': {
        const t = el('table', {class: 'lang'});
        const hr = el('tr', null, [el('th', {text: 'ภาษา'})]);
        C.langSkills.forEach(s => hr.appendChild(el('th', {text: s[1]})));
        t.appendChild(el('thead', null, [hr]));
        const tb = el('tbody');
        C.langs.forEach(l => {
          const tr = el('tr', null, [el('td', {text: l[1]})]);
          C.langSkills.forEach(s => {
            const sel = el('select', {name: 'lang_' + l[0] + '_' + s[0], 'aria-label': l[1] + ' ' + s[1]}, [el('option', {value: '', text: '-'})]);
            C.langLevels.forEach(v => sel.appendChild(el('option', {value: v, text: v})));
            tr.appendChild(el('td', null, [sel]));
          });
          tb.appendChild(tr);
        });
        t.appendChild(tb); wrap.appendChild(t); break;
      }
      case 'personality': {
        const p = C.personality;
        wrap.innerHTML = '';
        if (p.instruction) wrap.appendChild(el('div', {class: 'help', text: p.instruction}));
        const box = el('div', {class: 'pers'});
        p.items.forEach(t => box.appendChild(el('label', {class: 'opt'}, [el('input', {type: 'checkbox', name: k, value: t}), el('span', {text: t})])));
        wrap.appendChild(box); break;
      }
      case 'file': {
        fileStore[k] = [];
        const inp = el('input', {type: 'file', accept: f.accept, multiple: f.multiple, style: 'display:none'});
        const drop = el('div', {class: 'file-drop'}, ['📎 แตะเพื่อเลือกไฟล์ (สูงสุด ' + C.maxMb + ' MB ต่อไฟล์)']);
        const list = el('div', {class: 'file-list'});
        drop.addEventListener('click', () => inp.click());
        inp.addEventListener('change', () => { addFiles(f, inp.files, list); inp.value = ''; });
        wrap.appendChild(drop); wrap.appendChild(inp); wrap.appendChild(list); break;
      }
    }
    wrap.appendChild(el('div', {class: 'err-msg'}));
    return wrap;
  }

  const STEPS = C.steps;
  STEPS.forEach((st, si) => {
    const sec = el('section', {class: 'step', 'data-step': si});
    sec.appendChild(el('div', {class: 'panel step-head'}, [el('h2', {text: st.title}), st.desc ? el('p', {text: st.desc}) : null]));
    const panel = el('div', {class: 'panel'});
    const grid = el('div', {class: 'grid'});
    panel.appendChild(grid);
    let target = grid;
    st.fields.forEach(f => {
      if (f.type === 'heading'){
        if (f.collapse){
          const d = el('details', {class: 'grp'}, [el('summary', {text: f.label + ' (ถ้ามี)'})]);
          const g = el('div', {class: 'grid'}); d.appendChild(g); grid.appendChild(d); target = g; return;
        }
        target = grid;
      }
      target.appendChild(renderField(f));
    });
    sec.appendChild(panel);
    $('steps').appendChild(sec);
  });

  /* ---------- values & conditions ---------- */
  function val(k){
    const els = form.querySelectorAll('[name="' + k + '"]');
    if (!els.length) return '';
    const e = els[0];
    if (e.type === 'radio'){ const c = form.querySelector('[name="' + k + '"]:checked'); return c ? c.value : ''; }
    if (e.type === 'checkbox'){
      const f = FIELDS.find(x => x.k === k);
      if (f && f.type === 'check') return e.checked ? 'ใช่' : '';
      return Array.from(form.querySelectorAll('[name="' + k + '"]:checked')).map(c => c.value);
    }
    return (e.value || '').trim();
  }
  function visible(f){
    const c = f.showIf; if (!c) return true;
    const v = val(c.k);
    if (c.eq !== undefined) return v === c.eq;
    if (c.ne !== undefined) return v !== c.ne;
    if (c.in) return c.in.indexOf(v) > -1;
    if (c.has) return Array.isArray(v) && v.indexOf(c.has) > -1;
    return true;
  }
  function refresh(){
    FIELDS.forEach(f => { const w = form.querySelector('.f[data-k="' + f.k + '"]'); if (w) w.classList.toggle('hidden', !visible(f)); });
    form.querySelectorAll('.opt').forEach(o => o.classList.toggle('checked', !!o.querySelector('input:checked')));
  }

  FIELDS.filter(f => f.auto === 'age').forEach(f => {
    const inp = form.elements[f.k];
    inp.addEventListener('change', () => {
      const d = new Date(inp.value); if (isNaN(d)) return;
      if (d.getFullYear() > 2400) d.setFullYear(d.getFullYear() - 543);   // กรอกปีเป็น พ.ศ.
      const n = new Date(); let a = n.getFullYear() - d.getFullYear();
      if (n.getMonth() < d.getMonth() || (n.getMonth() === d.getMonth() && n.getDate() < d.getDate())) a--;
      if (a > 0 && a < 100) form.elements.age.value = a;
    });
  });

  /* ---------- files ---------- */
  // รูปถ่าย: ครอปให้พอดีช่องติดรูป (กว้าง:สูง ≈ 0.84) และย่อเป็น JPEG
  function preparePhoto(file){
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const R = 0.838, iw = img.naturalWidth, ih = img.naturalHeight;
        let sw = iw, sh = ih, sx = 0, sy = 0;
        if (iw / ih > R){ sw = ih * R; sx = (iw - sw) / 2; } else { sh = iw / R; sy = (ih - sh) * 0.3; }
        const H = Math.min(900, sh), W = Math.round(H * R);
        const c = document.createElement('canvas'); c.width = W; c.height = Math.round(H);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        const data = c.toDataURL('image/jpeg', 0.88);
        resolve({name: file.name.replace(/\.[^.]+$/, '') + '.jpg', type: 'image/jpeg', data: data.split(',')[1], size: Math.round(data.length * 0.75), preview: data});
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('อ่านรูปไม่ได้ กรุณาใช้ไฟล์ JPG หรือ PNG')); };
      img.src = url;
    });
  }
  function addFiles(f, files, list){
    if (!f.multiple) fileStore[f.k] = [];
    if (f.photo){
      const file = files[0]; if (!file) return;
      preparePhoto(file).then(p => { fileStore[f.k] = [p]; drawFiles(f.k, list); }).catch(e => alert(e.message));
      return;
    }
    Array.from(files).forEach(file => {
      if (file.size > C.maxMb * 1048576){ alert('ไฟล์ "' + file.name + '" ใหญ่เกิน ' + C.maxMb + ' MB'); return; }
      const r = new FileReader();
      r.onload = () => { fileStore[f.k].push({name: file.name, type: file.type, data: String(r.result).split(',')[1], size: file.size}); drawFiles(f.k, list); };
      r.readAsDataURL(file);
    });
  }
  function drawFiles(k, list){
    list.innerHTML = '';
    fileStore[k].forEach((f, i) => {
      const b = el('button', {type: 'button', text: 'ลบ'});
      b.addEventListener('click', () => { fileStore[k].splice(i, 1); drawFiles(k, list); });
      const info = el('span', null, [f.preview ? el('img', {src: f.preview, style: 'width:60px;height:72px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:10px;border:1px solid #dde3ec'}) : null, f.name + ' (' + (f.size / 1048576).toFixed(2) + ' MB)']);
      list.appendChild(el('div', {style: 'align-items:center'}, [info, b]));
    });
  }

  /* ---------- validate ---------- */
  function thaiId(id){ if (!/^\d{13}$/.test(id)) return false; let s = 0; for (let i = 0; i < 12; i++) s += +id[i] * (13 - i); return (11 - s % 11) % 10 === +id[12]; }
  function validate(stepIdx){
    let first = null;
    FIELDS.forEach(f => {
      const w = form.querySelector('.f[data-k="' + f.k + '"]');
      if (!w) return;
      const si = +w.closest('.step').dataset.step;
      if (stepIdx !== undefined && si !== stepIdx) return;
      let err = '';
      if (visible(f) && f.type !== 'langtable' && f.type !== 'file'){
        const v = val(f.k);
        const empty = Array.isArray(v) ? !v.length : v === '';
        if (f.req && empty) err = f.type === 'check' ? 'กรุณาทำเครื่องหมายยืนยัน' : 'กรุณากรอกข้อมูลในช่องนี้';
        else if (!empty && typeof v === 'string'){
          if (f.type === 'thaiid' && !thaiId(v.replace(/\D/g, ''))) err = 'เลขบัตรประชาชนไม่ถูกต้อง กรุณาตรวจสอบ';
          if (f.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) err = 'รูปแบบอีเมลไม่ถูกต้อง';
          if (f.type === 'zip' && !/^\d{5}$/.test(v)) err = 'รหัสไปรษณีย์ต้องเป็นตัวเลข 5 หลัก';
          if (f.type === 'tel' && !/^[0-9+\-\s()]{8,20}$/.test(v)) err = 'รูปแบบเบอร์โทรไม่ถูกต้อง';
          if (f.type === 'number' && !/^[0-9.,\s]+$/.test(v)) err = 'กรุณากรอกเป็นตัวเลข';
        }
      }
      w.classList.toggle('has-err', !!err);
      w.querySelector('.err-msg').textContent = err;
      if (err && !first) first = {w, si};
    });
    return first;
  }
  form.addEventListener('input', e => { const w = e.target.closest('.f'); if (w) w.classList.remove('has-err'); });

  /* ---------- steps ---------- */
  function go(i, instant){
    cur = Math.max(0, Math.min(i, STEPS.length - 1));
    form.querySelectorAll('.step').forEach((s, si) => s.classList.toggle('hidden', si !== cur));
    const last = cur === STEPS.length - 1;
    $('backBtn').style.visibility = cur > 0 ? 'visible' : 'hidden';
    $('nextBtn').classList.toggle('hidden', last);
    $('submitBtn').classList.toggle('hidden', !last);
    $('stepLabel').textContent = STEPS[cur].title;
    $('stepCount').textContent = 'ขั้นตอน ' + (cur + 1) + ' / ' + STEPS.length;
    $('progressBar').style.width = ((cur + 1) / STEPS.length * 100) + '%';
    refresh();
    if (!instant) window.scrollTo({top: Math.max(0, $('progressWrap').offsetTop - 4), behavior: 'smooth'});
    saveSoon();
  }
  $('backBtn').addEventListener('click', () => go(cur - 1));
  $('nextBtn').addEventListener('click', () => {
    const e = validate(cur);
    if (e){ e.w.scrollIntoView({behavior: 'smooth', block: 'center'}); return; }
    go(cur + 1);
  });

  /* ---------- draft ---------- */
  let timer = null;
  function saveSoon(){ clearTimeout(timer); timer = setTimeout(saveDraft, 700); }
  function saveDraft(){
    const d = {step: cur, v: {}};
    Array.from(form.elements).forEach(e => {
      if (!e.name || e.type === 'file') return;
      if (e.type === 'radio' || e.type === 'checkbox'){ if (e.checked) (d.v[e.name] = d.v[e.name] || []).push(e.value); }
      else if (e.value) d.v[e.name] = e.value;
    });
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); } catch (e) {}
  }
  function restoreDraft(){
    let d = null;
    try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) {}
    if (!d || !d.v || !Object.keys(d.v).length) return;
    Array.from(form.elements).forEach(e => {
      if (!e.name || e.type === 'file' || !(e.name in d.v)) return;
      const v = d.v[e.name];
      if (e.type === 'radio' || e.type === 'checkbox') e.checked = Array.isArray(v) && v.indexOf(e.value) > -1;
      else e.value = v;
    });
    const pos = form.elements.position; if (pos) pos.dispatchEvent(new Event('change'));
    cur = d.step || 0;
    $('draftNote').classList.remove('hidden');
  }
  function clearDraft(){ try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
  $('clearDraft').addEventListener('click', () => { if (confirm('ล้างข้อมูลที่กรอกไว้ทั้งหมด?')){ clearDraft(); location.reload(); } });
  form.addEventListener('input', () => { refresh(); saveSoon(); });
  form.addEventListener('change', () => { refresh(); saveSoon(); });

  /* ---------- submit ---------- */
  function showAlert(m){ const a = $('alert'); a.textContent = m; a.style.display = m ? 'block' : 'none'; if (m) a.scrollIntoView({behavior: 'smooth', block: 'center'}); }
  form.addEventListener('submit', e => {
    e.preventDefault(); showAlert('');
    const bad = validate();
    if (bad){ if (bad.si !== cur) go(bad.si, true); setTimeout(() => bad.w.scrollIntoView({behavior: 'smooth', block: 'center'}), 60); return; }
    const answers = {}, files = {};
    FIELDS.forEach(f => {
      if (f.type === 'file'){ files[f.k] = fileStore[f.k].map(x => ({name: x.name, type: x.type, data: x.data})); return; }
      if (f.type === 'langtable'){ C.langs.forEach(l => C.langSkills.forEach(s => { const k = 'lang_' + l[0] + '_' + s[0]; answers[k] = val(k); })); return; }
      answers[f.k] = visible(f) ? val(f.k) : '';
    });
    const btn = $('submitBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>กำลังส่ง... (อาจใช้เวลาสักครู่)';
    const done = res => {
      clearDraft();
      ['progressWrap', 'draftNote', 'actions'].forEach(id => $(id).classList.add('hidden'));
      $('steps').innerHTML = '';
      $('steps').appendChild(el('div', {class: 'panel done'}, [el('div', {class: 'ic', text: '✓'}), el('h2', {text: 'ส่งใบสมัครเรียบร้อยแล้ว'}),
        el('p', {text: 'ขอบคุณที่สนใจร่วมงานกับ ' + C.company + ' ฝ่ายบุคคลจะติดต่อกลับหากคุณสมบัติตรงกับตำแหน่งงาน'}),
        res && res.appNo ? el('div', {class: 'appno', text: 'เลขที่ใบสมัคร ' + res.appNo}) : null]));
      window.scrollTo({top: 0, behavior: 'smooth'});
    };
    const fail = err => { btn.disabled = false; btn.textContent = 'ส่งใบสมัคร'; showAlert('ส่งไม่สำเร็จ: ' + ((err && err.message) || err || 'กรุณาลองใหม่')); };
    if (HAS_GAS) google.script.run.withSuccessHandler(done).withFailureHandler(fail).submitApplication({answers, files});
    else { window.__lastAnswers = answers; setTimeout(() => done({appNo: 'APP-DEMO'}), 300); }
  });

  restoreDraft();
  go(cur, true);
})();
</script>
</body>
</html>
